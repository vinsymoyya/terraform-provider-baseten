name: Contribution validation
on:
  push:
    branches: [validation/environment-settings]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Lint
        run: |
          go mod tidy
          go fmt ./...
          terraform fmt -check -recursive examples/
          git diff --exit-code
      - name: Vet
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Test
        if: ${{ !cancelled() }}
        run: go test ./...
      - name: Build
        if: ${{ !cancelled() }}
        run: go build ./...
      - name: Docs
        if: ${{ !cancelled() }}
        run: |
          go tool tfplugindocs generate --provider-name baseten
          git diff --exit-code
